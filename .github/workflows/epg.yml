name: EPG update

on:
  schedule:
    # 6am & 6pm Malaysia (UTC+8) = 22:00 & 10:00 UTC
    - cron: "0 10,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build EPG
        run: python3 scripts/epg_update.py

      - name: Commit & push if changed
        run: |
          git config user.name "maaz-github"
          git config user.email "148773701+maaz-github@users.noreply.github.com"
          git add EPG_Astro_Malaysia.xml EPG_Astro_Malaysia.xml.gz
          if git diff --cached --quiet; then
            echo "no EPG change"
          else
            git commit -m "EPG update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Purge jsDelivr cache
        if: success()
        run: |
          for f in EPG_Astro_Malaysia.xml.gz EPG_Astro_Malaysia.xml MY_TV_Full.m3u; do
            curl -sf --max-time 30 "https://purge.jsdelivr.net/gh/maaz-github/mytvfiles@main/$f" || true
          done
